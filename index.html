<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#091c39">
  <title>CVT Celebrations</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#091c39;color:white}
    body{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:16px}
    .stage{width:min(100%,510px);text-align:center}.eyebrow{color:#e7b46d;letter-spacing:.16em;font-size:.75rem;font-weight:800}
    h1{font-size:clamp(1.5rem,5vw,2rem);margin:12px 0}.frame{margin:18px auto;border:3px solid #cf9c4c;background:#122a4b;border-radius:20px;overflow:hidden;box-shadow:0 18px 60px #0008}
    img{display:block;width:100%;max-height:72dvh;object-fit:contain}.message{color:#cbd5e1;line-height:1.5}.hidden{display:none}
    .done{padding:34px 15px}.check{font-size:3.5rem}button{font:inherit;color:#101828;background:#e7b46d;border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;margin:12px}
    .timer{color:#d8b87b;font-size:.85rem}
  </style>
</head>
<body>
  <main class="stage" aria-live="polite">
    <section id="celebration" class="hidden">
      <div class="eyebrow">CREATIVE VISION TECH</div>
      <h1>🎉 Great work!</h1>
      <div class="frame"><img id="photo" alt="CVT job-complete celebration"></div>
      <p class="timer">Celebration ends in <span id="count">5</span> seconds</p>
    </section>
    <section id="done" class="hidden done">
      <div class="check">✅</div>
      <h1>You're all done!</h1>
      <p class="message">Great work today. You can return to Slack.</p>
      <button id="again" type="button">Celebrate again</button>
    </section>
    <section id="empty" class="hidden done">
      <h1>CVT Celebrations</h1>
      <p class="message">No celebration pictures found yet. Upload PNG files named <strong>1.png</strong>, <strong>2.png</strong>, and so on, next to index.html in GitHub.</p>
    </section>
  </main>
  <script>
    // Upload files named 1.png, 2.png ... up to 30.png in the same folder as index.html.
    const imageNames = Array.from({length:30},(_,i)=>`${i+1}.png`);
    const $ = id => document.getElementById(id);
    const show = id => {
      ['celebration','done','empty'].forEach(name => $(name).classList.toggle('hidden',name!==id));
    };
    function imageExists(name) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(name);
        img.onerror = () => resolve(null);
        img.src = name;
      });
    }
    let available = [], timer;
    function celebrate() {
      if(!available.length){show('empty');return;}
      clearInterval(timer);
      $('photo').src = available[Math.floor(Math.random()*available.length)];
      $('count').textContent = '5';
      show('celebration');
      let remaining = 5;
      timer = setInterval(() => {
        remaining--;
        if(remaining <= 0){clearInterval(timer);show('done');}
        else $('count').textContent = remaining;
      },1000);
    }
    $('again').addEventListener('click',celebrate);
    Promise.all(imageNames.map(imageExists)).then(results=>{
      available = results.filter(Boolean);
      celebrate();
    });
  </script>
</body>
</html>
